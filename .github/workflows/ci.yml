# Two-tier CI, both tiers free of any personal spending or private state:
#
# 1. `unit-tests` — ONLY the repository's self-contained unit verification.
#    It executes `python main.py verify` (scripts/verify.py): the suites that
#    need no Docker, Kafka, Spark cluster, MinIO, PostgreSQL or Redis services
#    and no credentials or secrets.
# 2. `service-integration` — the 74 reproducible service-dependent suites
#    (M4 PostgreSQL serving, M5 Redis serving, M7 alert evaluation) executed
#    against throwaway GitHub Actions service containers (postgres:16, redis:7)
#    with CI-only dummy credentials. A collection gate fails the job unless
#    exactly 74 tests are collected, so missing services or changed suites
#    surface as failures, never as silent skips.
#    Excluded by design: the 42-test M8 notification suite
#    (tests/unit/test_notifications.py) reads the retained, unpublished
#    certified M7 fixture in `alerts_serving.alert_events` and cannot run
#    against fresh state; making it self-seeding is a separate future task.
#
# There is no build, deploy or hosted-service automation in this repository.
# CI proves only the tests it actually executes; it is not proof of a
# full end-to-end streaming pipeline.
name: CI

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Java 17 (required by the local Spark test suites)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run self-contained verification suite
        run: python main.py verify

  service-integration:
    # Reproducible service-dependent tier: M7 alert evaluation (tests/unit/
    # test_alerts.py, 40), M4 PostgreSQL serving (tests/unit/
    # test_postgres_serving.py, 10) and M5 Redis serving (tests/unit/
    # test_redis_serving.py, 24). Each suite creates uniquely-named disposable
    # schemas (m4_test_*, m5_test_*, m7_source_*/m7_test_*) and Redis
    # namespaces (oip:m5:test-*) and drops them on teardown; nothing here
    # touches shared, production or retained certified state.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: oip_user
          POSTGRES_DB: order_intelligence
          POSTGRES_PASSWORD: ci-oip-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oip_user -d order_intelligence"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    # Explicit configuration (mirrors, not new behavior): the suites build
    # engines through storage.gold_postgres_serving.get_engine /
    # storage.postgres_redis_serving.get_postgres_engine, which require
    # POSTGRES_PASSWORD and otherwise default to oip_user/order_intelligence
    # on localhost:5432; get_redis_client defaults to localhost:6379 with no
    # auth. Setting every value keeps the job honest about what it connects to.
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: oip_user
      POSTGRES_DB: order_intelligence
      POSTGRES_PASSWORD: ci-oip-password
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Assert exactly 74 service-integration tests are collected
        run: |
          line=$(python -m pytest tests/unit/test_alerts.py tests/unit/test_postgres_serving.py tests/unit/test_redis_serving.py --collect-only -q | tail -n 1)
          echo "collection summary: $line"
          echo "$line" | grep -qE '^74 tests collected' || {
            echo "::error::expected exactly 74 collected tests (M7 40 + M4 10 + M5 24); got: $line"
            exit 1
          }

      # No continue-on-error, no retries, no skip tolerance: the real pytest
      # exit status is the job status. Connection loss to either service
      # raises inside the fixtures and fails the run.
      - name: Run service-dependent suites against the CI PostgreSQL/Redis
        run: python -m pytest -q tests/unit/test_alerts.py tests/unit/test_postgres_serving.py tests/unit/test_redis_serving.py
