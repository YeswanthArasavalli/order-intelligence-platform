# =============================================================================
# Order Intelligence Platform — Phase 1 Infrastructure
# Kafka 3.7+ KRaft mode (no Zookeeper)
# =============================================================================

networks:
  oip-network:
    driver: bridge
    name: oip-network

volumes:
  kafka-data:
    name: oip-kafka-data
  minio-data:
    name: oip-minio-data
  postgres-data:
    name: oip-postgres-data
  redis-data:
    name: oip-redis-data
  prometheus-data:
    name: oip-prometheus-data
  grafana-data:
    name: oip-grafana-data

services:

  # ---------------------------------------------------------------------------
  # KAFKA — KRaft mode (no Zookeeper)
  # Single node acts as both broker and controller in dev
  # ---------------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:${KAFKA_VERSION:-7.7.12}
    container_name: oip-kafka
    hostname: kafka
    restart: unless-stopped
    ports:
      # Host clients use HOST_KAFKA_PORT and receive the EXTERNAL listener.
      # Internal Compose clients continue to use kafka:9092.
      - "${HOST_KAFKA_PORT:-9092}:29092"
      - "${HOST_KAFKA_CONTROLLER_PORT:-29093}:29093"
    environment:
      # KRaft settings — this node is both broker and controller
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"

      # Listeners
      KAFKA_LISTENERS: "INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:9092,EXTERNAL://localhost:${HOST_KAFKA_PORT:-9092}"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"

      # Cluster identity — MUST be pre-generated and stored in .env
      CLUSTER_ID: "${KAFKA_CLUSTER_ID}"

      # Storage
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"

      # Replication — single node dev settings
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1

      # Performance tuning
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # Log retention
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000

      # JVM heap — keep small for dev
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - oip-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      start_period: 30s
      interval: 10s
      timeout: 10s
      retries: 10

  # ---------------------------------------------------------------------------
  # SCHEMA REGISTRY — Avro schema management and enforcement
  # ---------------------------------------------------------------------------
  schema-registry:
    image: confluentinc/cp-schema-registry:${KAFKA_VERSION:-7.7.12}
    container_name: oip-schema-registry
    hostname: schema-registry
    restart: unless-stopped
    ports:
      - "${HOST_SCHEMA_REGISTRY_PORT:-8081}:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: "schema-registry"
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: "kafka:9092"
      SCHEMA_REGISTRY_LISTENERS: "http://0.0.0.0:8081"
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 1
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: "${SCHEMA_COMPATIBILITY_LEVEL:-BACKWARD}"
      SCHEMA_REGISTRY_LOG4J_ROOT_LOGLEVEL: "WARN"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - oip-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --spider -q http://localhost:8081/subjects || exit 1"
        ]
      start_period: 20s
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # KAFKA UI — Web interface for topic inspection and consumer group monitoring
  # ---------------------------------------------------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:${KAFKA_UI_VERSION:-v0.7.2}
    container_name: oip-kafka-ui
    hostname: kafka-ui
    restart: unless-stopped

    ports:
      - "${HOST_KAFKA_UI_PORT:-8080}:8080"

    environment:
      KAFKA_CLUSTERS_0_NAME: "oip-local"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:9092"
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: "http://schema-registry:8081"

      DYNAMIC_CONFIG_ENABLED: "false"

      LOGGING_LEVEL_ROOT: "INFO"

    depends_on:
      kafka:
        condition: service_healthy

      schema-registry:
        condition: service_healthy

    networks:
      - oip-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --spider -q http://localhost:8080/actuator/health || exit 1"
        ]
      start_period: 60s
      interval: 15s
      timeout: 10s
      retries: 10

  # ---------------------------------------------------------------------------
  # MINIO — S3-compatible local object storage
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:${MINIO_VERSION:-RELEASE.2024-11-07T00-52-20Z}
    container_name: oip-minio
    hostname: minio

    restart: unless-stopped

    ports:
      - "${HOST_MINIO_API_PORT:-9000}:9000"
      - "${HOST_MINIO_CONSOLE_PORT:-9001}:9001"

    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"

    command: server /data --console-address ":9001"

    volumes:
      - minio-data:/data

    networks:
      - oip-network


  # ---------------------------------------------------------------------------
  # MINIO INIT
  # ---------------------------------------------------------------------------
  minio-init:
    image: minio/mc:${MINIO_MC_VERSION:-RELEASE.2024-11-05T11-29-45Z}
    container_name: oip-minio-init

    restart: on-failure

    depends_on:
      minio:
        condition: service_started

    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"

    entrypoint: >
      /bin/sh -c "
        echo 'Waiting for MinIO...';

        until mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
        do
          echo 'MinIO not ready yet...';
          sleep 5;
        done;

        echo 'Creating buckets...';

        mc mb --ignore-existing local/bronze;
        mc mb --ignore-existing local/silver;
        mc mb --ignore-existing local/gold;
        mc mb --ignore-existing local/checkpoints;

        echo 'Buckets created';

        exit 0;
      "

    networks:
      - oip-network


  # ---------------------------------------------------------------------------
  # POSTGRESQL — Analytics store for Gold layer metrics
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:${POSTGRES_VERSION:-16-alpine}
    container_name: oip-postgres
    hostname: postgres
    restart: unless-stopped
    ports:
      - "${HOST_POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-order_intelligence}"
      POSTGRES_USER: "${POSTGRES_USER:-oip_user}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      PGDATA: "/var/lib/postgresql/data/pgdata"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/postgres/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    networks:
      - oip-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oip_user} -d ${POSTGRES_DB:-order_intelligence}"]
      start_period: 15s
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # REDIS — Hot-path cache for dashboard KPIs, leaderboard, active alerts
  # ---------------------------------------------------------------------------
  redis:
    image: redis:${REDIS_VERSION:-7-alpine}
    container_name: oip-redis
    hostname: redis
    restart: unless-stopped
    ports:
      - "${HOST_REDIS_PORT:-6379}:6379"
    command: >
      redis-server
      --maxmemory ${REDIS_MAX_MEMORY:-256mb}
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
      --save 900 1
      --save 300 10
      --save 60 10000
    volumes:
      - redis-data:/data
    networks:
      - oip-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      start_period: 5s
      interval: 10s
      timeout: 3s
      retries: 10

  # ---------------------------------------------------------------------------
  # M9 exporter — cached metrics; read-only bounded dependency probes.
  # Business applications opt in with OIP_TELEMETRY_URL; it is never required.
  metrics-exporter:
    build:
      context: ./observability
    image: oip-metrics-exporter:m9
    container_name: oip-metrics-exporter
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_METRICS_PORT:-8000}:8000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: "${POSTGRES_DB:-order_intelligence}"
      POSTGRES_USER: "${POSTGRES_USER:-oip_user}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      REDIS_HOST: redis
      REDIS_GOLD_NAMESPACE: "${REDIS_GOLD_NAMESPACE:-oip:m5:gold-serving}"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      MINIO_ENDPOINT: http://minio:9000
      OIP_DASHBOARD_HEALTH_URL: "${OIP_DASHBOARD_HEALTH_URL:-http://oip-modernization-verify:8501/_stcore/health}"
      METRICS_COLLECTION_INTERVAL_SECONDS: "${METRICS_COLLECTION_INTERVAL_SECONDS:-15}"
    networks:
      - oip-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  # PROMETHEUS — Metrics collection and storage
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION:-v2.54.1}
    container_name: oip-prometheus
    hostname: prometheus
    restart: unless-stopped

    ports:
      - "127.0.0.1:${HOST_PROMETHEUS_PORT:-9090}:9090"

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"

    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

    networks:
      - oip-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --spider -q http://localhost:9090/-/ready || exit 1"
        ]
      start_period: 30s
      interval: 15s
      timeout: 10s
      retries: 10

  # ---------------------------------------------------------------------------
  # GRAFANA — Dashboard visualisation (reads from Prometheus)
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-11.3.0}
    container_name: oip-grafana
    hostname: grafana
    restart: unless-stopped

    ports:
      - "127.0.0.1:${HOST_GRAFANA_PORT:-3000}:3000"

    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_LOG_LEVEL: "warn"

    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro

    depends_on:
      prometheus:
        condition: service_started

    networks:
      - oip-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --spider -q http://localhost:3000/api/health || exit 1"
        ]
      start_period: 60s
      interval: 15s
      timeout: 10s
      retries: 10
